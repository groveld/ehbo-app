<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Post invoeren</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0A5C3B}a:hover{color:#06402A}
input,textarea{box-sizing:border-box}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <header style="padding: 14px 12px 6px; display: flex; align-items: center; gap: 4px;">
    <a href="#" aria-label="Annuleren" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #16181D;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; flex-grow: 1;">Nieuwe post</h1>
  </header>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 6px 20px 0; flex-grow: 1; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600;">Soort post</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
        <button style="height: 48px; border-radius: 10px; border: 1px solid #D4D1C7; background: #FFFFFF; font: 500 14px 'IBM Plex Sans', sans-serif; color: #16181D;">Start/finish</button>
        <button style="height: 48px; border-radius: 10px; border: 2px solid #1F6FB2; background: #E4EEF7; font: 600 14px 'IBM Plex Sans', sans-serif; color: #124A78;">Waterpost</button>
        <button style="height: 48px; border-radius: 10px; border: 1px solid #D4D1C7; background: #FFFFFF; font: 500 14px 'IBM Plex Sans', sans-serif; color: #16181D;">Stempelpost</button>
        <button style="height: 48px; border-radius: 10px; border: 1px solid #D4D1C7; background: #FFFFFF; font: 500 14px 'IBM Plex Sans', sans-serif; color: #16181D;">Verkeer</button>
        <button style="height: 48px; border-radius: 10px; border: 1px solid #D4D1C7; background: #FFFFFF; font: 500 14px 'IBM Plex Sans', sans-serif; color: #16181D;">EHBO-post</button>
        <button style="height: 48px; border-radius: 10px; border: 1px solid #D4D1C7; background: #FFFFFF; font: 500 14px 'IBM Plex Sans', sans-serif; color: #16181D;">Anders…</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="naam" style="font-size: 13px; font-weight: 600;">Naam</label>
        <input id="naam" value="Waterpost 3 · brug" style="height: 46px; border-radius: 10px; border: 1px solid #D4D1C7; padding: 0 12px; font: 400 15px 'IBM Plex Sans', sans-serif; background: #FFFFFF; color: #16181D;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="km" style="font-size: 13px; font-weight: 600;">Km-punt</label>
        <input id="km" value="21,1" style="height: 46px; border-radius: 10px; border: 1px solid #D4D1C7; padding: 0 12px; font: 400 15px 'IBM Plex Sans', sans-serif; background: #FFFFFF; color: #16181D;">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; background: #FFFFFF; border-radius: 16px; padding: 14px;">
      <span style="font-size: 13px; font-weight: 600;">Locatie</span>
      <button style="height: 56px; border-radius: 12px; border: none; background: #16181D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px 'IBM Plex Sans', sans-serif;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><circle cx="12" cy="12" r="7"></circle></svg>Huidige GPS-positie vastleggen</button>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px;">52.98612, 5.81347</span>
        <span style="color: #0A5C3B; font-weight: 600;">± 4 m</span>
      </div>
      <a href="#" style="font-size: 13px; font-weight: 600;">Of: punt op de kaart prikken</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="route" style="font-size: 13px; font-weight: 600;">Aanrijroute / bijzonderheden</label>
      <textarea id="route" rows="2" style="border-radius: 10px; border: 1px solid #D4D1C7; padding: 10px 12px; font: 400 14px 'IBM Plex Sans', sans-serif; background: #FFFFFF; color: #16181D; resize: none;">Via [weg], hek bij boerderij staat open.</textarea>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 13px; font-weight: 600;">Contactpersonen</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <input aria-label="Naam contactpersoon" placeholder="Naam" style="height: 44px; border-radius: 10px; border: 1px solid #D4D1C7; padding: 0 12px; font: 400 14px 'IBM Plex Sans', sans-serif; background: #FFFFFF; color: #16181D;">
        <input aria-label="Telefoon contactpersoon" placeholder="06-…" style="height: 44px; border-radius: 10px; border: 1px solid #D4D1C7; padding: 0 12px; font: 400 14px 'IBM Plex Sans', sans-serif; background: #FFFFFF; color: #16181D;">
      </div>
      <a href="#" style="font-size: 13px; font-weight: 600;">+ Nog een contact</a>
    </div>
  </div>

  <div style="padding: 12px 16px 22px;">
    <button style="width: 100%; height: 56px; border-radius: 16px; border: none; background: #16181D; color: #FFFFFF; font: 700 16px 'IBM Plex Sans', sans-serif;">Post opslaan</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
