# Voorbeeld voor lokaal testen of voor Unraid met de Docker Compose-plugin.
# Vervang OWNER/REPO door je GitHub-gebruiker en repository (kleine letters).
services:
  ehbo-app:
    image: ghcr.io/OWNER/REPO:latest
    container_name: ehbo-app
    restart: unless-stopped
    user: "99:100"              # Unraid: nobody:users, zodat appdata schrijfbaar is
    ports:
      - "3080:3000"             # alleen voor toegang vanaf je thuisnetwerk; cloudflared wijst naar http://ehbo-app:3000
    environment:
      TZ: Europe/Amsterdam
      VAPID_SUBJECT: "mailto:beheer@jouwdomein.nl"   # verplicht: echt contactadres
      ADMIN_PHONE: "0612345678"                      # eerste beheerder; daarna beheer je beheerders in de app
    volumes:
      - /mnt/user/appdata/ehbo-app:/data
