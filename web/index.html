<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>EHBO-app</title>
  <meta name="description" content="Posten, contacten en EHBO-oproepen tijdens het evenement.">
  <meta name="theme-color" content="#16181D">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/brand/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EHBO-app">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- The page background before any stylesheet has loaded, so opening the app never shows a black screen. -->
  <style>html, body { margin: 0; background: #F6F5F1; } html[data-theme="dark"], html[data-theme="dark"] body { background: #121317; }</style>
  <!-- Light or dark before anything shows, as colorScheme.ts decides it later. -->
  <script>try { var a = JSON.parse(localStorage.getItem('app.appearance') || '"system"'); document.documentElement.dataset.theme = a === 'dark' || (a !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch (e) {}</script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
